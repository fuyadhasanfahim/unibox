services:
    db:
        image: postgres:17
        container_name: unibox-db
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        ports:
            - "127.0.0.1:${POSTGRES_PORT}:5432"
        volumes:
            - unibox-pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 5s
            timeout: 3s
            retries: 10
    redis:
        image: redis:7-alpine
        container_name: unibox-redis
        restart: unless-stopped
        command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
        ports:
            - "127.0.0.1:${REDIS_PORT}:6379"
        volumes:
            - unibox-redisdata:/data
        healthcheck:
            test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
            interval: 5s
            timeout: 3s
            retries: 10
        environment:
            REDIS_PASSWORD: ${REDIS_PASSWORD}
    mailpit:
        image: axllent/mailpit:v1.27
        container_name: unibox-mailpit
        restart: unless-stopped
        environment:
            MP_MAX_MESSAGES: 500
        ports:
            # Web UI + HTTP API (localhost only). Dev inbox: nothing here ever leaves the machine.
            - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
        healthcheck:
            test: ["CMD", "/mailpit", "readyz"]
            interval: 5s
            timeout: 3s
            retries: 10
volumes:
    unibox-pgdata:
    unibox-redisdata:
