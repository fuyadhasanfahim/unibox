services:
    db:
        image: postgres:17
        container_name: unibox-db
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        ports:
            - "127.0.0.1:${POSTGRES_PORT}:5432"
        volumes:
            - unibox-pgdata:/var/lib/postgresql/data
volumes:
    unibox-pgdata:
